<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ATM Banking System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#1e3c72,#2a5298);
            min-height:100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .main-card{
            border-radius:20px;
            background:white;
            box-shadow:0 15px 40px rgba(0,0,0,0.2);
        }

        .navbar{
            background: rgba(0,0,0,0.2) !important;
            backdrop-filter: blur(10px);
        }

        .btn-custom{
            border-radius:25px;
            padding:8px 20px;
        }

        .table th{
            background:#2a5298;
            color:white;
        }

        .balance-box{
            font-size:1.5rem;
            font-weight:bold;
            color:#198754;
        }

        footer{
            text-align:center;
            color:white;
            margin-top:30px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
  <div class="container">
    <span class="navbar-brand mb-0 h1">💳 ATM Banking System</span>
  </div>
</nav>

<div class="container py-5">
    {% block content %}{% endblock %}
</div>

<footer>
    <p>Flask + MySQL Project | 2026</p>
</footer>

</body>
</html>
