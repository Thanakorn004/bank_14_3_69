{% extends 'base.html' %}
{% block content %}

<div class="main-card p-5 col-md-6 mx-auto">

    <h3 class="text-center mb-4">➕ สร้างบัญชีใหม่</h3>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">หมายเลขบัญชี</label>
            <input type="text" name="account_number" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">ชื่อผู้ใช้</label>
            <input type="text" name="username" class="form-control" required>
        </div>

        <button class="btn btn-primary w-100 btn-custom">สร้างบัญชี</button>
    </form>

</div>

{% endblock %}
