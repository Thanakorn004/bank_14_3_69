{% extends 'base.html' %}
{% block content %}

<div class="main-card p-5">

    <!-- ปุ่มกลับ -->
    <a href="/" class="btn btn-secondary mb-3">⬅ กลับหน้าหลัก</a>

    <h3 class="mb-3">👤 {{ account[1] }}</h3>

    <div class="alert alert-success text-center">
        💰 ยอดเงินคงเหลือ:
        <span class="balance-box">{{ account[2] }} บาท</span>
    </div>

    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card p-4 shadow-sm">
                <h5>ฝากเงิน</h5>
                <form method="POST" action="/deposit/{{ account[0] }}">
                    <input type="number" step="0.01" name="amount" class="form-control mb-3" required>
                    <button class="btn btn-success w-100 btn-custom">ฝากเงิน</button>
                </form>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-4 shadow-sm">
                <h5>ถอนเงิน</h5>
                <form method="POST" action="/withdraw/{{ account[0] }}">
                    <input type="number" step="0.01" name="amount" class="form-control mb-3" required>
                    <button class="btn btn-danger w-100 btn-custom">ถอนเงิน</button>
                </form>
            </div>
        </div>
    </div>

    <hr class="my-5">

    <h5>📜 ประวัติธุรกรรม</h5>

    <table class="table table-striped text-center align-middle">
        <tr>
            <th>ประเภท</th>
            <th>จำนวนเงิน</th>
            <th>เวลา</th>
        </tr>

        {% for t in transactions %}
        <tr>
            <td>{{ t[0] }}</td>
            <td>{{ t[1] }}</td>
            <td>{{ t[2] }}</td>
        </tr>
        {% endfor %}
    </table>

</div>

{% endblock %}
